<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;width:340px;margin:0;padding:16px;color:#111827}h2{font-size:17px;margin:0 0 8px}.muted{font-size:12px;color:#6b7280}.price{font-size:28px;font-weight:900;color:#166534;margin:10px 0}.box{background:#f3f4f6;border-radius:12px;padding:12px;margin:10px 0}button{width:100%;border:0;border-radius:10px;padding:11px 12px;font-weight:800;cursor:pointer;margin-top:8px}.primary{background:#111827;color:#fff}.green{background:#dcfce7;color:#166534}.warn{color:#92400e;font-size:12px}.row{display:flex;gap:8px;align-items:center}.row input{width:76px;padding:8px;border:1px solid #d1d5db;border-radius:8px}.switch{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}</style></head><body><h2>🔥 Radar de Oferta Real</h2><div class="muted">Captura “Você pagará” e pode monitorar abas de checkout abertas automaticamente.</div><div id="status" class="box">Clique em capturar.</div><button id="capture" class="primary">Capturar preço final</button><button id="send" class="green" disabled>Enviar e gravar no histórico</button><div class="box"><div class="switch"><input id="autoEnabled" type="checkbox"> Monitor 24/7</div><div class="row" style="margin-top:8px"><span class="muted">Intervalo</span><input id="interval" type="number" min="5" value="30"><span class="muted">min</span></div><button id="saveAuto" class="green">Salvar monitor automático</button><button id="runAuto">Testar agora</button><div id="autoStatus" class="muted" style="margin-top:8px">Carregando status…</div></div><script src="popup.js"></script></body></html>
