<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radar de Oferta Real — Autorização</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827;margin:0;display:grid;place-items:center;min-height:100vh;padding:20px}
    .card{max-width:560px;background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 18px #00000014}
    h1{margin-top:0;font-size:24px} code{display:block;word-break:break-all;background:#f9fafb;padding:12px;border-radius:10px;margin:12px 0}
    a{display:inline-block;margin-top:8px;background:#111827;color:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:700}
    .ok{color:#166534;font-weight:800}.warn{color:#92400e;font-weight:800}
  </style>
</head>
<body>
  <main class="card">
    <h1>Radar de Oferta Real</h1>
    <p id="status">Recebendo retorno do Mercado Livre…</p>
    <code id="codeBox">Aguardando código de autorização.</code>
    <p style="font-size:13px;color:#6b7280">Esta página apenas exibe o código retornado na URL. Ela não troca o código por token e não armazena credenciais.</p>
    <a href="./">Voltar ao Radar</a>
  </main>
<script>
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  const error = params.get('error');
  const status = document.getElementById('status');
  const box = document.getElementById('codeBox');
  if(code){
    status.innerHTML = '<span class="ok">Autorização recebida com sucesso.</span>';
    box.textContent = code;
    sessionStorage.setItem('meli_authorization_code', code);
  } else if(error){
    status.innerHTML = '<span class="warn">O Mercado Livre retornou um erro.</span>';
    box.textContent = error + (params.get('error_description') ? ' — ' + params.get('error_description') : '');
  } else {
    status.innerHTML = '<span class="warn">A página abriu sem código de autorização.</span>';
    box.textContent = 'Use esta URL como URI de redirect no aplicativo do Mercado Livre.';
  }
</script>
</body>
</html>
