<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salvando preço no Radar</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827;margin:0;padding:30px}.box{max-width:560px;margin:40px auto;background:white;border-radius:16px;padding:22px;box-shadow:0 2px 10px #0001}.ok{color:#166534;font-weight:800}.bad{color:#991b1b;font-weight:800}</style></head><body><div class="box"><h2>🔥 Radar de Oferta Real</h2><p id="msg">Salvando preço capturado…</p></div><script>
const KEY='radar_oferta_real_catalog_v2';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');d.products=d.products||[];d.data=d.data||{};d.hints=d.hints||{};d.manual=d.manual||{};return d}catch{return{products:[],data:{},hints:{},manual:{}}}}
const q=new URLSearchParams(location.search),id=(q.get('product_id')||'').toUpperCase(),item=(q.get('item_id')||'').toUpperCase(),price=Number(q.get('price'));
if(!/^(MLB\d{6,15}|MLBU\d{6,16})$/.test(id)||!Number.isFinite(price)||price<=0){msg.innerHTML='<span class="bad">Dados de captura inválidos.</span>';}
else{const d=load();if(!d.products.includes(id))d.products.unshift(id);if(/^MLB\d{6,15}$/.test(item))d.hints[id]=item;d.manual[id]={price,source:'checkout_extension',updatedAt:new Date().toISOString()};localStorage.setItem(KEY,JSON.stringify(d));msg.innerHTML=`<span class="ok">Preço final salvo: R$ ${price.toFixed(2).replace('.',',')}</span><br>Redirecionando para o Radar…`;setTimeout(()=>location.replace('./?captured=1'),700)}
</script></body></html>
