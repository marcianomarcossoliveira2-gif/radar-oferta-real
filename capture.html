<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Radar - Captura</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f3f4f6;color:#111827;margin:0;padding:24px}.card{max-width:620px;margin:40px auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 2px 14px #0001}.price{font-size:36px;font-weight:900;color:#166534}.ok{background:#dcfce7;color:#166534;padding:10px 12px;border-radius:10px;font-weight:800}.warn{background:#fef3c7;color:#92400e;padding:10px 12px;border-radius:10px}.muted{color:#6b7280;font-size:13px}a{display:inline-block;margin-top:16px;background:#111827;color:#fff;text-decoration:none;padding:12px 16px;border-radius:10px;font-weight:800}</style></head><body><div class="card"><h2>🔥 Radar de Oferta Real</h2><div id="status">Registrando captura…</div><div id="details"></div><a id="go" href="./" style="display:none">Abrir Radar</a></div><script>
const KEY='radar_oferta_real_catalog_v2';
const CAPTURE_API='https://llgaeuvtrcpcvrcxkvpz.supabase.co/functions/v1/radar-meli-capture-api';
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');d.products=d.products||[];d.data=d.data||{};d.hints=d.hints||{};d.manual=d.manual||{};d.captureHistory=d.captureHistory||{};return d}catch{return{products:[],data:{},hints:{},manual:{},captureHistory:{}}}}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
function money(v){return Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
(async()=>{const q=new URLSearchParams(location.search);const productId=(q.get('product_id')||'').toUpperCase();const itemId=(q.get('item_id')||'').toUpperCase();const price=Number(q.get('price'));const source=q.get('source')||'checkout_extension';const status=document.getElementById('status'),details=document.getElementById('details'),go=document.getElementById('go');if(!/^(MLB\d{6,16}|MLBU\d{6,16})$/.test(productId)||!Number.isFinite(price)||price<=0){status.className='warn';status.textContent='Captura inválida. Volte ao checkout e tente novamente.';go.style.display='inline-block';return}
const now=new Date().toISOString();const d=load();if(!d.products.includes(productId))d.products.unshift(productId);if(itemId)d.hints[productId]=itemId;d.manual[productId]={price,source:'checkout_extension',itemId:itemId||null,updatedAt:now};d.captureHistory[productId]=d.captureHistory[productId]||[];d.captureHistory[productId].push({price,itemId:itemId||null,source:'checkout_extension',capturedAt:now});d.captureHistory[productId]=d.captureHistory[productId].slice(-180);save(d);
let serverOk=false,serverMsg='';try{const r=await fetch(CAPTURE_API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({product_id:productId,item_id:itemId,price,source})});const j=await r.json().catch(()=>({}));serverOk=r.ok&&j.ok;serverMsg=serverOk?`Histórico central: ${j.history90d?.observations??1} captura(s) em até 90 dias.`:`Servidor: ${j.error||'falha ao registrar'}`;}catch(e){serverMsg='Não foi possível sincronizar com o histórico central agora.'}
status.className=serverOk?'ok':'warn';status.textContent=serverOk?'✅ Preço capturado e gravado automaticamente':'⚠️ Preço salvo no navegador; sincronização central pendente';details.innerHTML=`<div class="price">${money(price)}</div><p><b>${productId}</b>${itemId?` • ${itemId}`:''}</p><p class="muted">Fonte: extensão do checkout • ${new Date(now).toLocaleString('pt-BR')}</p><p class="muted">${serverMsg}</p>`;go.href='./?v=capture2';go.style.display='inline-block';})();
</script></body></html>
